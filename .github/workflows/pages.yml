# Выкладка сайта на GitHub Pages: при каждом push в main собирается статическая версия (npm run build:static)
# и публикуется на https://ruxa.kz (свой домен, без подпапки).
# Включить один раз: GitHub -> Settings -> Pages -> Build and deployment -> Source: GitHub Actions,
# там же Custom domain = ruxa.kz (после того как DNS у регистратора прописан, см. README).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # браузер для проверочных скриптов на сервере не нужен
      PUPPETEER_SKIP_DOWNLOAD: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build static site
        run: npm run build:static
        env:
          # свой домен: без подпапки
          BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://ruxa.kz
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}

      - name: Add CNAME for custom domain
        # на случай переключения источника Pages на "Deploy from a branch" в будущем;
        # для текущего источника "GitHub Actions" GitHub сам хранит домен из Settings -> Pages и этот файл не обязателен
        run: echo "ruxa.kz" > out/CNAME

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
